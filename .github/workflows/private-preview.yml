name: PR replay preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up verification runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test simulation and replay export
        run: |
          node test-node.cjs
          node scripts/test-preview.cjs
          node scripts/test-sweep.cjs
          node scripts/test-sweep-view.cjs
          node scripts/test-compare.cjs
          node scripts/test-proof.cjs
          node scripts/test-planning.cjs
          node scripts/test-planning-view.cjs
          node scripts/test-two-zombies.cjs
          node scripts/test-two-zombies-view.cjs
          node scripts/test-avoidability.cjs
          node --max-old-space-size=384 --test scripts/test-neural.cjs scripts/test-neural-release.cjs
          node scripts/test-one-tick-reference.cjs
          node scripts/test-two-tick-reference.cjs
          node scripts/test-two-tick-reference-properties.cjs
          node --test scripts/test-two-tick.cjs scripts/test-two-tick-release.cjs
          node --test scripts/test-one-tick.cjs scripts/test-one-tick-release.cjs
          python3 -B scripts/test-avoidability-checker.py
          node --test scripts/test-jev.cjs scripts/test-jev-view.cjs scripts/test-jev-release.cjs
          python3 -B scripts/test-jev-runner.py
          node --test scripts/test-jev-controller.cjs scripts/test-jev-controller-release.cjs scripts/test-jev-controller-view.cjs
          python3 -B scripts/test-jev-controller-runner.py
          python3 -B scripts/check-jev-controller-reference.py
          node --test scripts/test-jev-policy.cjs scripts/test-jev-policy-release.cjs scripts/test-jev-policy-view.cjs
          python3 -B scripts/test-jev-policy-runner.py
          python3 -B scripts/check-jev-policy-reference.py
          node --test scripts/test-jev-safe*.cjs
          python3 -B scripts/test-jev-safe-runner.py
          python3 -B scripts/test-jev-safe-reference.py
          python3 -B scripts/check-jev-safe-reference.py
      - name: Generate full position replay
        env:
          PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/build-preview.cjs preview
          node scripts/build-jev.cjs preview
          node scripts/build-jev-controller.cjs preview
          node scripts/build-jev-policy.cjs preview
          node scripts/build-jev-safe.cjs preview
          node scripts/build-sweep.cjs preview
          node scripts/build-proof.cjs preview
          node scripts/build-planning.cjs preview
          node scripts/build-two-zombies.cjs preview
          node scripts/build-avoidability.cjs --out-dir preview
          python3 -B scripts/check-avoidability.py preview/avoidability-certificate.json --out-dir /tmp/avoidability-check
          ZL010_DATA=preview/avoidability.json node --test scripts/test-avoidability-view.cjs
          node --max-old-space-size=384 scripts/build-neural.cjs --out-dir preview
          ZL011_DATA=preview/neural.json node --test scripts/test-neural-view.cjs
          timeout 890s node --max-old-space-size=384 scripts/build-one-tick.cjs --out-dir preview
          ZL012_DATA=preview/one-tick.json node --test scripts/test-one-tick-release.cjs
          ZL012_DATA=preview/one-tick.json node scripts/test-one-tick-view.cjs
          timeout 890s node --max-old-space-size=384 scripts/build-two-tick.cjs --out-dir preview
          ZL013_DATA=preview/two-tick.json node --test scripts/test-two-tick-release.cjs
          ZL013_DATA=preview/two-tick.json node scripts/test-two-tick-view.cjs
          cp two-tick.html two-tick-view.js two-tick-policy.js preview/
          cp one-tick.html one-tick-view.js one-tick-policy.js preview/
          cp neural.html neural-view.js neural-policy.js preview/
          mkdir -p preview/models
          cp models/feed-forward.json models/feed-forward.js models/feed-forward-initial.json preview/models/
          cp avoidability.html avoidability-view.js preview/
          cp two-zombies.js two-zombies.html two-zombies-view.js preview/
          cp planner.js planning.html planning-view.js preview/
          cp sweep.html sweep-view.js simulation.js compare.html compare-view.js preview/
          mkdir -p preview/experiments
          cp experiments/ZL-011-protocol.md experiments/ZL-011-feed-forward.md preview/experiments/
          mkdir -p preview/evidence
          cp -R evidence/neural preview/evidence/
          cp -R evidence/one-tick preview/evidence/
          cp -R evidence/two-tick preview/evidence/
          cp experiments/ZL-013-protocol.md experiments/ZL-013-two-tick.md preview/experiments/
          cp experiments/ZL-012-protocol.md experiments/ZL-012-one-tick.md preview/experiments/
          cp experiments/ZL-010-avoidability.md experiments/ZL-010-protocol.md preview/experiments/
          cp experiments/ZL-009-two-zombies.md experiments/ZL-009-protocol.md preview/experiments/
          cp experiments/ZL-007-start-position-effects.md experiments/ZL-008-lookahead.md experiments/ZL-008-protocol.md preview/experiments/
      - name: Upload offline preview
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zombie-replay-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}
          path: preview/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
      - name: Link preview in run summary
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '## Zombie Lab PR replay\n\n[Download replay ZIP](%s) (GitHub sign-in required to download the artifact).\n\nUnzip, then open `jev-safe.html` for ZL-017 original versus immediate-safe guardrail versus exact-planner replay, or `index.html` for earlier comparisons. Includes full replay history, JSON/CSV, frozen inputs, reports and original evidence. No training or paid inference is run in CI. Main publishes on GitHub Pages.\n\nSource commit: `%s`. Artifact expires after seven days.\n' "$ARTIFACT_URL" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
